<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClemaxDigitalStudio — Checkout</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; background: #f6f3ec; color: #2b2b2b; margin: 0; padding: 40px 20px; text-align: center; }
  .card { max-width: 520px; margin: 40px auto; background: #ffffff; border: 1px solid #ddd5c3; border-radius: 12px; padding: 32px 28px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { font-size: 16px; line-height: 1.5; }
  .item { font-size: 14px; color: #6b6252; }
  a.button { display: inline-block; margin-top: 16px; background: #7a8b6f; color: #ffffff; text-decoration: none; padding: 12px 26px; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>ClemaxDigitalStudio</h1>
  <p>Thank you for shopping with us. You are being taken to this item on Etsy, where you can choose your size and colour and complete your purchase securely.</p>
  <p class="item" id="itemline"></p>
  <a class="button" id="go" href="https://www.etsy.com/shop/ClemaxDigitalStudio">Continue to Etsy</a>
</div>
<script>
(function () {
  var SHOP = "https://www.etsy.com/shop/ClemaxDigitalStudio";
  var params = new URLSearchParams(window.location.search);
  var raw = params.get("products") || params.get("product_id") || params.get("productId") || params.get("items") || "";
  var first = raw.split(",")[0].split(":")[0].trim();
  var target = SHOP;
  if (/^\d{6,}$/.test(first)) {
    target = "https://www.etsy.com/listing/" + first;
    document.getElementById("itemline").textContent = "Item reference: " + first;
  }
  var coupon = params.get("coupon");
  if (coupon && target === SHOP) {
    target = "https://clemaxdigitalstudio.etsy.com?coupon=" + encodeURIComponent(coupon);
  }
  document.getElementById("go").href = target;
  setTimeout(function () { window.location.replace(target); }, 700);
})();
</script>
</body>
</html>
